name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Preparar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Gastos-VORDER.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gastos-APK
          path: out/Gastos-VORDER.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gastos VORDER v1.0.${{ github.run_number }}
          files: out/Gastos-VORDER.apk

      - name: Guardar log de compilación
        if: always()
        run: |
          mkdir -p /tmp/bl
          tail -n 300 build.log > /tmp/bl/build.log 2>/dev/null || echo "sin log" > /tmp/bl/build.log
          cd /tmp/bl
          git init -q
          git checkout -q -b buildlog
          git add .
          git -c user.name=ci -c user.email=ci@example.com commit -qm "log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" buildlog
